name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package static app
        run: |
          zip -r fontpair-studio-${GITHUB_REF_NAME}.zip index.html app.js font-core.js styles.css icon.svg assets/screenshot.png README.md LICENSE CHANGELOG.md
          sha256sum fontpair-studio-${GITHUB_REF_NAME}.zip > fontpair-studio-${GITHUB_REF_NAME}.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            fontpair-studio-${{ github.ref_name }}.zip
            fontpair-studio-${{ github.ref_name }}.sha256
